# ============================================================
# JDA4Spring — example configuration (.properties format)
# ============================================================
#
# This file can be used in three ways:
#
#   1. Rename to jda4spring.properties and place in src/main/resources/
#      → loaded automatically by JDA4Spring
#
#   2. Add bots.* entries directly to your application.properties
#      → works out of the box, no extra file needed
#
#   3. Point to any file from application.properties:
#        jda4spring.configfile=path/to/bots.properties
#        jda4spring.configfile=classpath:bots.properties
#
# The bot name (e.g. "MyBot") is arbitrary — it links entries together.
# Add the config file to .gitignore to keep tokens out of source control.
# ============================================================


# ── Single bot ───────────────────────────────────────────────

# Token from an environment variable (recommended)
bots.MyBot.token=${DISCORD_BOT_TOKEN}

# Comma-separated list of @BotTask bean names to attach to this bot
bots.MyBot.tasks=MyBotTask

# Gateway intents — only request what your bot actually needs.
# See: https://jda.wiki/using-jda/gateway-intents-and-member-cache-policy/
bots.MyBot.intents=GUILD_MESSAGES, DIRECT_MESSAGES, MESSAGE_CONTENT

# Activity / status — pick one suffix:
#   .playing    →  "Playing some game"
#   .listening  →  "Listening to a playlist"
#   .watching   →  "Watching the logs"
#   .competing  →  "Competing in a tournament"
# No suffix = plain custom status.
bots.MyBot.activity.playing=some game
#bots.MyBot.activity.listening=a playlist
#bots.MyBot.activity.watching=the logs
#bots.MyBot.activity.competing=a tournament
#bots.MyBot.activity=custom status text


# ── Multiple bots ─────────────────────────────────────────────
# Each bot has its own name, token, tasks, intents, and activity.

bots.SecondBot.token=${DISCORD_BOT_TOKEN_2}
bots.SecondBot.tasks=TaskA, TaskB
bots.SecondBot.intents=GUILD_MESSAGES, MESSAGE_CONTENT
bots.SecondBot.activity.watching=two servers at once
