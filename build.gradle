import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'xyz.norbjert'
version = '0.0.10'

// Library project — the Spring Boot plugin is used only for dependency management.
// Disable the fat jar; the plain library jar is the published artifact.
bootJar {
    enabled = false
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

configurations {
    mockitoAgent
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Mockito java agent
    mockitoAgent 'org.mockito:mockito-core:5.23.0'

    //discord api
    implementation 'net.dv8tion:JDA:6.7.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'e2e'
    }
    failOnNoDiscoveredTests = false

    jvmArgs "-javaagent:${configurations.mockitoAgent.files.find { it.name.contains('mockito-core') }.absolutePath}"
}

// Tests that talk to real Discord. Not part of `check` — run them explicitly.
['e2e', 'integration'].each { tag ->
    tasks.register("${tag}Test", Test) {
        description = "Runs ${tag} tests against a real Discord bot account."
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tag
        }
        failOnNoDiscoveredTests = false
        // always re-run — results depend on external Discord state, not just source changes
        outputs.upToDateWhen { false }

        testLogging {
            events 'passed', 'skipped', 'failed'
        }

        jvmArgs "-javaagent:${configurations.mockitoAgent.files.find { it.name.contains('mockito-core') }.absolutePath}"
    }
}